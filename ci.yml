name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -m "not integration" -v

  integration:
    runs-on: ubuntu-latest
    continue-on-error: true   # eBPF on hosted runners can be restricted; see README
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y bpftrace
      - name: Start sensor
        run: |
          sudo python3 sensor/sensor.py &
          sleep 8
          cat logs/events.log || true
      - name: Run integration tests
        run: pytest -m integration -v
